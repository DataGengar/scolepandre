<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SCOLOPANDRE — Forge</title>
<!--
  L'ÉDITEUR. Il tourne sur le moteur du jeu : mêmes shaders, mêmes primitives,
  même code de génération. Ce qu'on y voit est ce qu'on aura en partie.

  Le style suit celui d'Héphaïstos — palette « Rich Black », accent bleu
  magique, logotype à deux lignes, console à tags colorés. La feuille est dans
  src/editeur/theme.css, pendant web de son ui/theme.py.

  Lancement : Scolopandre.exe, ou bien
      python -m http.server 8000   puis  http://localhost:8000/editeur.html
-->
<link rel="stylesheet" href="src/editeur/theme.css">
<style>
  /* Mise en page propre à l'éditeur. Tout ce qui est couleur, typographie et
     composants vit dans theme.css : ici, seulement la grille. */
  #appli{ display:grid; grid-template-rows:58px 1fr 148px 24px; height:100% }
  #corps{ display:grid; grid-template-columns:1fr 336px; overflow:hidden }
  #scene{ position:relative; background:#080b0f; overflow:hidden }
  #scene>div{ position:absolute; inset:0 }
  #gl{ display:block; width:100%; height:100% }
  #carte2d{ display:block; width:100%; height:100%; cursor:crosshair }
  #fichier{ display:none }

  /* Le bandeau d'aide de la scène : les commandes souris, discrètes. */
  .aideScene{ position:absolute; left:10px; bottom:10px; padding:6px 10px;
    background:rgba(13,17,23,.82); border:1px solid var(--border);
    border-radius:4px; font-size:10px; color:var(--muted);
    font-family:var(--mono); pointer-events:none; z-index:2 }
  .aideScene b{ color:var(--magic); font-weight:400 }
</style>
</head>
<body>
<div id="appli">

  <!-- ══ BARRE ══ -->
  <div class="barre">
    <div class="marque">
      <div class="nom">⛏ SCOLOPANDRE</div>
      <div class="sous">FORGE</div>
    </div>
    <button class="onglet" id="ong-terrain"  aria-pressed="true">Terrain</button>
    <button class="onglet" id="ong-assets">Assets</button>
    <button class="onglet" id="ong-creature">Créature</button>
    <div class="droite">
      <button id="btOuvrir">Ouvrir…</button>
      <button id="btSauver">Enregistrer</button>
      <button id="btJouer" class="accent">▶ Jouer</button>
      <input type="file" id="fichier" accept=".json,application/json">
    </div>
  </div>

  <!-- ══ CORPS ══ -->
  <div id="corps">
    <div id="scene">
      <div id="vue-terrain"><canvas id="carte2d"></canvas></div>
      <div id="vue-assets"   hidden><div id="hote3d-assets"   style="width:100%;height:100%"></div></div>
      <div id="vue-creature" hidden><div id="hote3d-creature" style="width:100%;height:100%"></div></div>
      <!-- le contexte WebGL n'existe qu'une fois : editeur.js déplace ce
           canvas dans l'onglet actif -->
      <canvas id="gl" hidden></canvas>
      <div class="aideScene" id="aideScene"></div>
    </div>
    <div class="panneau">
      <div id="pan-terrain"></div>
      <div id="pan-assets"   hidden></div>
      <div id="pan-creature" hidden></div>
    </div>
  </div>

  <!-- ══ CONSOLE ══ -->
  <div class="console" id="console"></div>

  <!-- ══ ÉTAT ══ -->
  <div class="etat">
    <span id="etatPlan">—</span>
    <span id="etatOnglet"></span>
    <span style="margin-left:auto" id="etatPerf"></span>
  </div>
</div>

<script type="module" src="src/editeur/editeur.js"></script>
</body>
</html>
